name: minimal
description: A minimalistic Flutter website template for blogs and portfolios.
version: 2.1.1
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
#  responsive_framework:
#    path: ../
  # Uncomment to build standalone project.
  responsive_framework: ^1.5.1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  loading_gifs: ^0.3.0
  url_launcher: ^6.3.0 # Requires setup.
  chopper: ^8.0.1+1
  json_annotation: ^4.9.0
  flutter_social_button: ^1.1.6+1
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  animate_do: ^3.3.4
  flutter_spinkit: ^5.2.1
  http: ^1.2.2
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  flutter_emoji: ^2.5.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.14
  chopper_generator: ^8.0.1
  json_serializable: ^6.8.0
  swagger_dart_code_generator: ^3.0.0
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.3.4

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Minimal-Logo.png"
  image_path_android: "assets/Minimal-Logo.png"
  image_path_ios: "assets/Minimal-Logo-iOS.png"
  adaptive_icon_background: "#FFFFFFFF"
  adaptive_icon_foreground: "assets/Minimal-Logo-Adaptive.png"
  web:
    generate: true
  macos:
    generate: true
  windows:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - res/images/
    - res/icons/
    - res/backgrounds/
  
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
    - family: Urbanist-Bold
      fonts:
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
    - family: CanvaSans
      fonts:
        - asset: assets/fonts/CanvaSans-Regular.otf
    